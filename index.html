<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromeOS — Ultra Realistic Desktop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cblue: '#1a73e8',
                        cdark: '#202124',
                        clight: '#f1f3f4',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            user-select: none;
            overflow: hidden;
        }
        .app-window {
            position: absolute;
            transition: transform 0.1s ease, opacity 0.15s ease;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .shelf-icon {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .shelf-icon:hover {
            transform: translateY(-5px) scale(1.12);
        }
        .chrome-glass {
            background: rgba(32, 33, 36, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .popup-glass {
            background: rgba(29, 30, 34, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
    </style>
</head>
<body id="mainBody" class="text-slate-100 h-screen w-screen flex flex-col relative overflow-hidden bg-slate-950" style="background-image: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #020617 100%);" onclick="closeAllPopups(event)">

    <!-- Desktop Area -->
    <div class="flex-1 relative p-6 flex flex-col justify-start items-start gap-6 overflow-hidden" id="desktopArea">
        <!-- Desktop Grid Icons -->
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 max-w-4xl z-10">
            <button ondblclick="openAppWindow('games')" onclick="playSound('click')" class="group flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-20 text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <span class="text-[11px] font-medium text-white drop-shadow truncate w-full">Games Hub</span>
            </button>
            <button ondblclick="openAppWindow('youtube')" onclick="playSound('click')" class="group flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-20 text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <span class="text-[11px] font-medium text-white drop-shadow truncate w-full">YouTube</span>
            </button>
            <button ondblclick="openAppWindow('browser')" onclick="playSound('click')" class="group flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-20 text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <span class="text-[11px] font-medium text-white drop-shadow truncate w-full">Unblocked</span>
            </button>
            <button ondblclick="openAppWindow('settings')" onclick="playSound('click')" class="group flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-20 text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 to-orange-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-transform">

                </div>
                <span class="text-[11px] font-medium text-white drop-shadow truncate w-full">Settings</span>
            </button>
        </div>
    </div>

    <!-- ChromeOS App Launcher Popup -->
    <div id="appLauncherMenu" onclick="event.stopPropagation()" class="absolute bottom-16 left-3 z-50 w-[450px] popup-glass border border-white/15 rounded-3xl p-6 shadow-2xl hidden flex flex-col gap-4 transform transition-all scale-95 opacity-0">
        <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-circle-dot text-blue-400"></i> App Launcher</h3>
            <button onclick="toggleAppLauncher()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
        <!-- Search bar inside launcher -->
        <div class="relative">
            <input type="text" id="launcherSearch" placeholder="Search apps, games, or proxy links..." 
                class="w-full bg-black/40 border border-white/15 rounded-xl px-4 py-2.5 pl-9 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>
        <!-- Grid of launcher apps -->
        <div class="grid grid-cols-4 gap-3 max-h-72 overflow-y-auto pr-1">
            <button onclick="openAppWindow('games'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-gamepad"></i></div>

            </button>
            <button onclick="openAppWindow('youtube'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-red-600 flex items-center justify-center text-white text-base shadow"><i class="fa-brands fa-youtube"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">YouTube</span>
            </button>
            <button onclick="openAppWindow('browser'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-compass"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Browser</span>
            </button>
            <button onclick="openAppWindow('music'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-purple-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-music"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Music</span>
            </button>
            <button onclick="openAppWindow('calculator'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-amber-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-calculator"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Math</span>
            </button>
            <button onclick="openAppWindow('terminal'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-slate-700 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-terminal"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Terminal</span>
            </button>
            <button onclick="openAppWindow('settings'); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-gear"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Settings</span>
            </button>
            <button onclick="toggleStealthMode(); toggleAppLauncher();" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors">
                <div class="w-11 h-11 rounded-2xl bg-rose-600 flex items-center justify-center text-white text-base shadow"><i class="fa-solid fa-user-secret"></i></div>
                <span class="text-[11px] text-slate-200 truncate w-full text-center font-medium">Cloak</span>
            </button>
        </div>
    </div>

    <!-- ChromeOS Quick Settings Tray Popup -->
    <div id="quickSettingsPopup" onclick="event.stopPropagation()" class="absolute bottom-16 right-3 z-50 w-80 popup-glass border border-white/15 rounded-3xl p-5 shadow-2xl hidden flex flex-col gap-4 transform transition-all scale-95 opacity-0">
        <!-- User profile header -->
        <div class="flex items-center gap-3 p-2 bg-white/5 rounded-2xl">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-sm">DE</div>
            <div class="flex-1 truncate">
                <h4 class="text-xs font-bold text-white truncate">Diego User</h4>
                <p class="text-[10px] text-slate-400 truncate">diego.knows@chromebook.edu</p>
            </div>
            <button onclick="showNotification('Power', 'Locking session...');" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-300"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>

        <!-- Quick Toggles Grid -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="toggleQuickTile(this)" class="flex items-center gap-3 p-3 rounded-2xl bg-blue-600/30 border border-blue-500/40 text-left transition-all">
                <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xs"><i class="fa-solid fa-wifi"></i></div>
                <div><p class="text-[11px] font-bold text-white">Wi-Fi</p><p class="text-[9px] text-blue-300">School_Secure</p></div>
            </button>
            <button onclick="toggleQuickTile(this)" class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/10 text-left transition-all">
                <div class="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-slate-300 text-xs"><i class="fa-solid fa-bluetooth"></i></div>
                <div><p class="text-[11px] font-bold text-white">Bluetooth</p><p class="text-[9px] text-slate-400">Connected</p></div>
            </button>
        </div>

        <!-- Sliders -->
        <div class="space-y-3 bg-white/5 p-3.5 rounded-2xl">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-volume-high text-xs text-slate-300 w-4"></i>
                <input type="range" min="0" max="100" value="80" class="flex-1 h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-sun text-xs text-slate-300 w-4"></i>
                <input type="range" min="20" max="100" value="100" class="flex-1 h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
        </div>

        <!-- Status Badges -->
        <div class="flex items-center justify-between text-[11px] text-slate-300 px-1">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-emerald-400"></i> Shield Protected</span>
            <span id="popupFps" class="font-mono text-emerald-400 font-bold">60 FPS</span>
        </div>
    </div>

    <!-- Active App Window Container -->
    <div id="windowContainer" class="absolute inset-0 z-30 pointer-events-none hidden">
        <!-- Dynamically rendered draggable app window -->
    </div>

    <!-- ChromeOS Bottom Shelf -->
    <div class="h-14 chrome-glass border-t border-white/15 flex items-center justify-between px-3 z-40 select-none shadow-2xl">
        
        <!-- Left: Launcher & App Icons -->
        <div class="flex items-center gap-2">
            <!-- Launcher Button -->
            <button onclick="playSound('click'); toggleAppLauncher();" class="shelf-icon w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white shadow" title="Launcher">
                <i class="fa-solid fa-circle-dot text-blue-400 text-lg"></i>
            </button>

            <div class="h-6 w-[1px] bg-white/15 mx-1"></div>

            <!-- 9 Shelf App Buttons -->
            <div class="flex items-center gap-1.5">
                <button onclick="playSound('click'); openAppWindow('games')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-blue-400 text-base" title="Games & All Sites Hub">
                    <i class="fa-solid fa-gamepad"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('youtube')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-red-400 text-base" title="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('browser')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-emerald-400 text-base" title="Unblocked Browser">
                    <i class="fa-solid fa-compass"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('music')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-purple-400 text-base" title="Music">
                    <i class="fa-solid fa-music"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('calculator')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-amber-400 text-base" title="Calculator">
                    <i class="fa-solid fa-calculator"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('terminal')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-teal-400 text-base" title="Terminal">
                    <i class="fa-solid fa-terminal"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('settings')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-indigo-400 text-base" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button onclick="playSound('click'); toggleStealthMode()" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-rose-400 text-base" title="Stealth Cloak">
                    <i class="fa-solid fa-user-secret"></i>
                </button>
                <button onclick="playSound('click'); openAppWindow('custom')" class="shelf-icon w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-cyan-400 text-base" title="Custom URL">
                    <i class="fa-solid fa-globe"></i>
                </button>
            </div>
        </div>

        <!-- Right: ChromeOS Status Tray -->
        <button onclick="playSound('click'); toggleQuickSettings()" class="flex items-center gap-3 bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-2xl transition-colors cursor-pointer text-xs font-medium">
            <span id="realFpsCount" class="font-mono text-emerald-400 font-bold hidden sm:inline">60 FPS</span>
            <div class="flex items-center gap-1.5 text-slate-300">
                <i class="fa-solid fa-wifi text-xs text-blue-400"></i>
                <i class="fa-solid fa-battery-full text-xs text-emerald-400"></i>
            </div>
            <span id="shelfClock" class="font-bold text-white">12:00 PM</span>
        </button>

    </div>

    <!-- Toast Notification -->
    <div id="notificationToast" class="fixed bottom-20 right-6 z-50 transform translate-y-32 opacity-0 transition-all duration-300 popup-glass border border-blue-500/60 px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-4 max-w-sm">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-lg font-bold shadow-inner">
            <i class="fa-solid fa-bell"></i>
        </div>
        <div>
            <h4 id="toastTitle" class="text-xs font-bold text-slate-400 uppercase tracking-wider">ChromeOS</h4>
            <p id="toastMessage" class="text-sm font-semibold text-slate-100 mt-0.5">Notification message here</p>
        </div>
    </div>

    <script>
        // Real FPS Counter
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        const fpsElement = document.getElementById('realFpsCount');
        const popupFps = document.getElementById('popupFps');

        function measureFps(currentTime) {
            frameCount++;
            const delta = currentTime - lastFpsUpdate;
            if (delta >= 1000) {
                const currentFps = Math.round((frameCount * 1000) / delta);
                if (fpsElement) {
                    fpsElement.textContent = `${currentFps} FPS`;
                    if (popupFps) popupFps.textContent = `${currentFps} FPS`;
                    if (currentFps >= 50) fpsElement.className = 'font-mono text-emerald-400 font-bold hidden sm:inline';
                    else if (currentFps >= 30) fpsElement.className = 'font-mono text-amber-400 font-bold hidden sm:inline';
                    else fpsElement.className = 'font-mono text-rose-400 font-bold hidden sm:inline';
                }
                frameCount = 0;
                lastFpsUpdate = currentTime;
            }
            requestAnimationFrame(measureFps);
        }
        requestAnimationFrame(measureFps);

        // Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const clockEl = document.getElementById('shelfClock');
            if (clockEl) clockEl.textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                }
            } catch(e) {}
        }

        function showNotification(title, message) {
            const toast = document.getElementById('notificationToast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3500);
        }

        let isLauncherOpen = false;
        let isQuickSettingsOpen = false;

        function toggleAppLauncher() {
            playSound('click');
            closeAllPopups();
            isLauncherOpen = !isLauncherOpen;
            const menu = document.getElementById('appLauncherMenu');
            if (isLauncherOpen) {
                menu.classList.remove('hidden');
                setTimeout(() => menu.classList.remove('scale-95', 'opacity-0'), 10);
            } else {
                menu.classList.add('scale-95', 'opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        function toggleQuickSettings() {
            playSound('click');
            closeAllPopups();
            isQuickSettingsOpen = !isQuickSettingsOpen;
            const menu = document.getElementById('quickSettingsPopup');
            if (isQuickSettingsOpen) {
                menu.classList.remove('hidden');
                setTimeout(() => menu.classList.remove('scale-95', 'opacity-0'), 10);
            } else {
                menu.classList.add('scale-95', 'opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        function closeAllPopups(e) {
            if (isLauncherOpen) {
                isLauncherOpen = false;
                const menu = document.getElementById('appLauncherMenu');
                menu.classList.add('scale-95', 'opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
            if (isQuickSettingsOpen) {
                isQuickSettingsOpen = false;
                const menu = document.getElementById('quickSettingsPopup');
                menu.classList.add('scale-95', 'opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        function toggleQuickTile(btn) {
            playSound('click');
            const isActive = btn.classList.contains('bg-blue-600/30');
            if (isActive) {
                btn.className = 'flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/10 text-left transition-all';
                btn.querySelector('div').className = 'w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-slate-400 text-xs';
                btn.querySelectorAll('p')[1].className = 'text-[9px] text-slate-400';
            } else {
                btn.className = 'flex items-center gap-3 p-3 rounded-2xl bg-blue-600/30 border border-blue-500/40 text-left transition-all';
                btn.querySelector('div').className = 'w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xs';
                btn.querySelectorAll('p')[1].className = 'text-[9px] text-blue-300';
            }
        }

        let isStealthCloaked = false;
        function toggleStealthMode() {
            isStealthCloaked = !isStealthCloaked;
            if (isStealthCloaked) showNotification('Stealth Cloak', 'about:blank cloaking active.');
            else showNotification('Stealth Cloak', 'Cloaking disabled.');
        }

        // Exact User Provided Websites & Games List
        const rawLinks = [
            { id: 'u-1', name: "Calcsolver.net", url: "https://calcsolver.net", category: "math", icon: "fa-calculator" },
            { id: 'u-2', name: "Calcsolver.com", url: "https://calcsolver.com", category: "math", icon: "fa-calculator" },
            { id: 'u-3', name: "Mathcheck.net", url: "https://mathcheck.net", category: "math", icon: "fa-square-root-variable" },
            { id: 'u-4', name: "Solvecalc.net", url: "https://solvecalc.net", category: "math", icon: "fa-calculator" },
            { id: 'u-5', name: "Calc Solver Pro", url: "https://calcsolverpro.com", category: "math", icon: "fa-laptop-code" },
            { id: 'u-6', name: "Figurestand Worker", url: "https://figurestand.workerlo.workers.dev", category: "proxy", icon: "fa-server" },

        function initDragAndDrop(win) {
            const titlebar = win.querySelector('.window-titlebar');
            if (!win || !titlebar) return;

            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            titlebar.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = win.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                win.style.left = `${initialLeft + dx}px`;
                win.style.top = `${initialTop + dy}px`;
            }

            function onMouseUp() {
                isDragging = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }
