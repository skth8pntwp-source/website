        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #f3f4f6;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .win-mica {
            background: rgba(32, 32, 32, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
        }

        .win-glass {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .taskbar {
            background: rgba(24, 24, 24, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes windowOpen {
            0% { transform: scale(0.92) translateY(15px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .window-animate {
            animation: windowOpen 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            document.getElementById('taskTime').innerText = `${hours}:${minutes} ${ampm}`;
            document.getElementById('taskDate').innerText = now.toLocaleDateString();
            document.getElementById('lockClock').innerText = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('lockDate').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showPasswordInput() {
            document.getElementById('loginPrompt').classList.add('hidden');
            document.getElementById('passwordInputBox').classList.remove('hidden');
            document.getElementById('passInput').focus();
        }

        function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById('passInput').value;
            if (val === 'peanut' || val === '0290') {
                const lock = document.getElementById('lockScreen');
                lock.style.opacity = '0';
                setTimeout(() => lock.style.display = 'none', 700);
            } else {
                document.getElementById('loginError').innerText = "Incorrect password. Try peanut or 0290";
                document.getElementById('passInput').value = "";
            }
        }

        function lockDesktop() {
            const lock = document.getElementById('lockScreen');
            lock.style.display = 'flex';
            setTimeout(() => lock.style.opacity = '1', 50);
            document.getElementById('passwordInputBox').classList.add('hidden');
            document.getElementById('loginPrompt').classList.remove('hidden');
            document.getElementById('startMenu').classList.add('hidden');
        }

            "https://rawcdn.githack.com/seattleschools/media/main/batch/originallyut/20260916190251/dbbac7f8fede1769.svg"
        ];

        const apps = rawLinks.map((entry, index) => {
            let url = entry.trim();
            if (url === 'Games') url = '#';
            else if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            
            let name = entry;
            try {
                if (url !== '#') {
                    name = new URL(url).hostname.replace('www.', '');
                }
            } catch (e) {
                name = entry;
            }

            let icon = "🛡️";
            const lower = entry.toLowerCase();

            if (entry === 'Games') {
                icon = "🎮";
            } else if (lower.includes('calc') || lower.includes('math') || lower.includes('algebra') || lower.includes('geometry')) {
                icon = "🔢";
            } else if (lower.includes('game') || lower.includes('arcade') || lower.includes('hub') || lower.includes('frogie') || lower.includes('blooo') || lower.includes('seal') || lower.includes('petezah')) {
                icon = "🎮";
            } else if (lower.includes('study') || lower.includes('school') || lower.includes('quizlet') || lower.includes('canvas') || lower.includes('schoology') || lower.includes('ixl') || lower.includes('class')) {
                icon = "📚";
            } else if (lower.endsWith('.svg') || lower.includes('/svg')) {
                icon = "🖼️";
            }

            return { id: index, name: name, rawName: entry, url: url, icon: icon };
        });

        // Prioritize Games app first
        apps.sort((a, b) => {
            if (a.rawName === 'Games') return -1;
            if (b.rawName === 'Games') return 1;
            return 0;
        });

        // Render clean desktop (Only Games icon on desktop)
        const desktop = document.getElementById('desktop');
        function renderDesktop() {
            desktop.innerHTML = '';
            const gamesApp = apps.find(a => a.rawName === 'Games') || apps[0];
            
            const item = document.createElement('div');
            item.className = "flex flex-col items-center gap-1.5 p-2 rounded-lg hover:bg-white/10 cursor-pointer group text-center w-20";
            item.onclick = () => openApp('https://frogiesarcade.win', 'Games & Arcades', '🎮');
            item.innerHTML = `
                <div class="w-12 h-12 rounded-xl win-glass flex items-center justify-center text-2xl shadow-md group-hover:scale-105 transition-all bg-gradient-to-br from-indigo-600/80 to-purple-700/80 ring-2 ring-indigo-400">
                    <svg class="w-7 h-7 text-white drop-shadow" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 10.5c-.8-.8-2.2-.8-3 0l-1.5 1.5-3-3 1.5-1.5c.8-.8.8-2.2 0-3s-2.2-.8-3 0L9.5 6 6.5 3c-.8-.8-2.2-.8-3 0s-.8 2.2 0 3l3 3-1.5 1.5c-.8.8-.8 2.2 0 3s2.2.8 3 0l1.5-1.5 3 3-1.5 1.5c-.8.8-.8 2.2 0 3s2.2.8 3 0l3-3 1.5 1.5c.8.8 2.2.8 3 0s.8-2.2 0-3l-3-3 1.5-1.5c-.8.8-.8-2.2 0-3z"/></svg>
                </div>
                <span class="text-[11px] text-white font-medium truncate w-full drop-shadow">Games</span>
            `;
            desktop.appendChild(item);
        }

        const startGrid = document.getElementById('startGrid');
        function renderStartMenu(filter = '') {
            startGrid.innerHTML = '';
            const filtered = apps.filter(a => a.name.toLowerCase().includes(filter.toLowerCase()) || a.rawName.toLowerCase().includes(filter.toLowerCase()));
            document.getElementById('appCount').innerText = `${filtered.length} items`;
            
            filtered.forEach(app => {
                const item = document.createElement('div');
                item.className = "flex flex-col items-center justify-center gap-1 p-2.5 rounded-lg hover:bg-white/10 cursor-pointer text-center group";
                item.onclick = () => {
                    toggleStartMenu();
                    let targetUrl = app.url;
                    if (app.rawName === 'Games') targetUrl = 'https://frogiesarcade.win';
                    openApp(targetUrl, app.rawName, app.icon);
                };
                
                let iconHtml = app.icon;
                if (app.rawName === 'Games') {
                    iconHtml = `<svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 10.5c-.8-.8-2.2-.8-3 0l-1.5 1.5-3-3 1.5-1.5c.8-.8.8-2.2 0-3s-2.2-.8-3 0L9.5 6 6.5 3c-.8-.8-2.2-.8-3 0s-.8 2.2 0 3l3 3-1.5 1.5c-.8.8-.8 2.2 0 3s2.2.8 3 0l1.5-1.5 3 3-1.5 1.5c-.8.8-.8 2.2 0 3s2.2.8 3 0l3-3 1.5 1.5c.8.8 2.2.8 3 0s.8-2.2 0-3l-3-3 1.5-1.5c-.8.8-.8-2.2 0-3z"/></svg>`;
                }

                item.innerHTML = `
                    <div class="w-10 h-10 rounded-lg win-glass flex items-center justify-center text-lg shadow group-hover:scale-105 transition-all ${app.rawName === 'Games' ? 'bg-gradient-to-br from-indigo-600 to-purple-600 ring-1 ring-indigo-300' : ''}">
                        ${iconHtml}
                    </div>
                    <span class="text-[10px] text-slate-200 truncate w-full">${app.rawName}</span>
                `;
                startGrid.appendChild(item);
            });
        }

        renderDesktop();
        renderStartMenu();

        function toggleStartMenu() {
            document.getElementById('startMenu').classList.toggle('hidden');
        }

        document.getElementById('startSearch').addEventListener('input', (e) => {
            renderStartMenu(e.target.value);
        });

        let activeWinUrl = '';
        window.openApp = function(url, title = "Microsoft Edge", icon = "🌐") {
            activeWinUrl = url;
            document.getElementById('winTitle').innerText = title;
            document.getElementById('winIcon').innerText = icon === '🎮' ? '🎮' : icon;
            document.getElementById('winUrlDisplay').innerText = url;
            
            const win = document.getElementById('appWindow');
            win.classList.remove('hidden');
            const loader = document.getElementById('winLoader');
            loader.classList.remove('hidden');
            
            const frame = document.getElementById('winFrame');
            frame.src = url;
            frame.onload = () => loader.classList.add('hidden');
            setTimeout(() => loader.classList.add('hidden'), 3000);
        }

        window.closeWindow = function() {
            document.getElementById('appWindow').classList.add('hidden');
            document.getElementById('winFrame').src = '';
        }

        window.minimizeWindow = function() {
            document.getElementById('appWindow').classList.add('hidden');
        }

        window.maximizeWindow = function() {
            const win = document.getElementById('appWindow');
            win.classList.toggle('w-full');
            win.classList.toggle('h-full');
            win.classList.toggle('top-0');
            win.classList.toggle('left-0');
            win.classList.toggle('rounded-none');
        }

        window.reloadWin = function() {
            if (activeWinUrl) {
                document.getElementById('winLoader').classList.remove('hidden');
                document.getElementById('winFrame').src = activeWinUrl;
            }
        }

        window.addEventListener('click', (e) => {
            const menu = document.getElementById('startMenu');
            const startBtn = e.target.closest('button');
            if (!menu.contains(e.target) && !startBtn && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
